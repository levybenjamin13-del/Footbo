<style>
:root{--paper:#f7f7f2;--ink:#121417;--blue:#2459ff;--line:rgba(18,20,23,.18);--muted:#60656d;--gutter:clamp(1.2rem,4vw,4.5rem)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "DM Sans",sans-serif}a{color:inherit}button,input{color:inherit;font:inherit}button{cursor:pointer}.topbar{display:flex;align-items:center;justify-content:space-between;padding:1.4rem var(--gutter);border-bottom:1px solid var(--line)}.brand{font-weight:700;letter-spacing:-.05em;text-decoration:none}.brand span,.eyebrow,.rank,.rating{color:var(--blue)}nav{display:flex;gap:2rem;font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}nav a{text-decoration:none}nav a:hover{color:var(--blue)}.intro{display:grid;grid-template-columns:1.1fr .9fr;gap:6vw;max-width:90rem;margin:auto;padding:clamp(5rem,10vw,9rem) var(--gutter) clamp(4rem,7vw,6rem);border-bottom:1px solid var(--line)}h1,h2,h3{margin:0;font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.055em;line-height:.96}h1{max-width:9ch;font-size:clamp(4rem,9vw,9rem)}.intro-copy{align-self:end;max-width:28rem;font-size:1.15rem}.intro-copy p{margin:0 0 1.6rem}.intro-mark{position:relative;min-height:13rem}.intro-mark:before{content:"";position:absolute;inset:5% 10%;border:1px solid var(--line);border-radius:50%}.intro-mark:after{content:"";position:absolute;right:18%;top:16%;width:45%;aspect-ratio:1;background:var(--blue);border-radius:48% 52% 42% 58%;transform:rotate(-25deg)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;max-width:90rem;margin:auto;padding:3rem var(--gutter) 2rem}.toolbar h2{font-size:clamp(2.5rem,5vw,5rem)}.search{width:min(20rem,45vw);border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:.7rem 0;background:transparent;outline:0}.search:focus{border-color:var(--blue)}.filters{display:flex;gap:.6rem;overflow:auto;max-width:90rem;margin:auto;padding:0 var(--gutter) 2.2rem;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{flex:0 0 auto;border:1px solid var(--line);border-radius:99px;padding:.55rem .9rem;background:transparent;font-size:.78rem}.filter[aria-pressed=true],.filter:hover{background:var(--ink);color:var(--paper)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;max-width:90rem;margin:auto;padding:0 var(--gutter) 8rem}.athlete{display:flex;flex-direction:column;min-height:26rem;border-top:1px solid var(--line);padding:1.5rem 1rem 1.5rem 0}.athlete-photo{width:100%;height:12rem;object-fit:cover;margin-bottom:1.3rem;filter:grayscale(25%)}.athlete-top{display:flex;justify-content:space-between;gap:1rem}.athlete h3{font-size:clamp(1.5rem,2.5vw,2.2rem)}.rank{font:700 1.3rem/1 Fraunces,serif}.athlete p{margin:.65rem 0 1rem;color:var(--muted);font-size:.92rem}.athlete-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto}.stars{color:var(--blue);font-size:.75rem;letter-spacing:.06em}.rating{font:700 1.5rem/1 Fraunces,serif}.rate{border:0;background:transparent;color:var(--muted);font-size:.75rem}.rate:hover,.rate.is-liked{color:var(--blue)}.empty{grid-column:1/-1;padding:4rem 0;color:var(--muted)}footer{display:flex;justify-content:space-between;padding:1.5rem var(--gutter);border-top:1px solid var(--line);font-size:.75rem}.reveal{opacity:1;transform:none}@media(max-width:760px){nav a:first-child{display:none}.intro{display:block}.intro-copy{margin-top:2rem;font-size:1rem}.intro-mark{min-height:9rem;margin-top:1rem}.toolbar{display:block}.search{width:100%;margin-top:1.5rem}.grid{grid-template-columns:repeat(2,1fr);gap:1rem}.athlete{padding-right:0}.athlete-photo{height:9rem}@media(max-width:480px){.grid{grid-template-columns:1fr}.athlete-photo{height:13rem}}footer{display:block}footer span{display:block;margin-top:.5rem}}

<main>
<section class="intro"><div><p class="eyebrow">Les visages derrière les moments</p><h1>Les sportifs qui restent.</h1></div><div class="intro-copy"><p>De la piste aux bassins, retrouve les athlètes qui ont changé notre manière de regarder le sport.</p><div class="intro-mark" aria-hidden="true"></div></div></section>
<section><div class="toolbar"><h2>Les sportifs.</h2><input class="search" id="search" type="search" placeholder="Rechercher un nom..." aria-label="Rechercher un sportif"></div><div class="filters" aria-label="Filtrer par discipline"><button class="filter" aria-pressed="true" data-filter="Tous">Tous</button><button class="filter" aria-pressed="false" data-filter="Athlétisme">Athlétisme</button><button class="filter" aria-pressed="false" data-filter="Football">Football</button><button class="filter" aria-pressed="false" data-filter="Tennis">Tennis</button><button class="filter" aria-pressed="false" data-filter="Basketball">Basketball</button><button class="filter" aria-pressed="false" data-filter="Natation">Natation</button><button class="filter" aria-pressed="false" data-filter="Boxe">Boxe</button></div><div class="grid" id="athletes"></div></section>
</main><footer><strong>Sport box</strong><span>La mémoire collective du sport · <a href="index.html">Retour au classement</a></span></footer>

['Carl Lewis','Athlétisme'],['Michael Johnson','Athlétisme'],['Florence Griffith-Joyner','Athlétisme'],['Eliud Kipchoge','Athlétisme'],['Haile Gebrselassie','Athlétisme'],['David Rudisha','Athlétisme'],['Mo Farah','Athlétisme'],['Allyson Felix','Athlétisme'],['Shelly-Ann Fraser-Pryce','Athlétisme'],['Yohan Blake','Athlétisme'],['Tyson Gay','Athlétisme'],['Wayde van Niekerk','Athlétisme'],['Armand Duplantis','Athlétisme'],['Javier Sotomayor','Athlétisme'],['Jonathan Edwards','Athlétisme'],['Yelena Isinbayeva','Athlétisme'],['Jackie Joyner-Kersee','Athlétisme'],['Heike Drechsler','Athlétisme'],['Paavo Nurmi','Athlétisme'],['Emil Zatopek','Athlétisme'],
['Cristiano Ronaldo','Football'],['Pelé','Football'],['Diego Maradona','Football'],['Zinedine Zidane','Football'],['Kylian Mbappé','Football'],['Marta','Football'],['Alexia Putellas','Football'],['Ronaldinho','Football'],['Johan Cruyff','Football'],['Michel Platini','Football'],['Ronaldo Nazário','Football'],['Neymar','Football'],['Amandine Henry','Football'],['Luka Modrić','Football'],['Karim Benzema','Football'],['Didier Drogba','Football'],['Sergio Ramos','Football'],['Thierry Henry','Football'],['Ada Hegerberg','Football'],['Mia Hamm','Football'],
['Novak Djokovic','Tennis'],['Roger Federer','Tennis'],['Steffi Graf','Tennis'],['Martina Navratilova','Tennis'],['Billie Jean King','Tennis'],['Serena Williams','Tennis'],['Venus Williams','Tennis'],['Björn Borg','Tennis'],['Andre Agassi','Tennis'],['Pete Sampras','Tennis'],['Chris Evert','Tennis'],['Justine Henin','Tennis'],['Iga Świątek','Tennis'],['Naomi Osaka','Tennis'],['Ashleigh Barty','Tennis'],['Carlos Alcaraz','Tennis'],['Andy Murray','Tennis'],['Stan Wawrinka','Tennis'],['Monica Seles','Tennis'],['Jimmy Connors','Tennis'],

['Katie Ledecky','Natation'],['Mark Spitz','Natation'],['Ian Thorpe','Natation'],['César Cielo','Natation'],['Sarah Sjöström','Natation'],['Missy Franklin','Natation'],['Ryan Lochte','Natation'],['Caeleb Dressel','Natation'],['Federica Pellegrini','Natation'],['Adam Peaty','Natation'],

];
const athleteImages={Athlétisme:'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=700&q=80',Football:'https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=700&q=80',Tennis:'https://images.unsplash.com/photo-1554068865-24cecd4e34b8?auto=format&fit=crop&w=700&q=80',Basketball:'https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=700&q=80',Natation:'https://images.unsplash.com/photo-1530549387789-4c1017266635?auto=format&fit=crop&w=700&q=80',Boxe:'https://images.unsplash.com/photo-1549719386-e31cae9d5d37?auto=format&fit=crop&w=700&q=80'};
athletes.push(...moreAthletes.map(([name,sport],index)=>({name,sport,bio:`Une figure majeure de ${sport.toLowerCase()}, dont le geste a marqué son époque.`,rating:(4.1+(index%8)/10).toFixed(1).replace('.',','),votes:220+index*17,image:athleteImages[sport]})));
const grid=document.querySelector('#athletes'),search=document.querySelector('#search');let active='Tous';const liked=JSON.parse(localStorage.getItem('sportbox-athletes')||'[]');
function render(){const query=search.value.toLowerCase();const visible=athletes.filter(athlete=>(active==='Tous'||athlete.sport===active)&&athlete.name.toLowerCase().includes(query));grid.innerHTML=visible.length?visible.map((athlete,index)=>`<article class="athlete"><img class="athlete-photo" src="${athlete.image}" alt="Illustration de ${athlete.name}" loading="lazy"><div class="athlete-top"><h3>${athlete.name}</h3><span class="rank">${String(index+1).padStart(2,'0')}</span></div><p>${athlete.bio}</p><div class="athlete-bottom"><div><span class="stars" aria-label="Note ${athlete.rating} sur 5">★★★★★</span><span class="rating">${athlete.rating}</span></div><button class="rate ${liked.includes(athlete.name)?'is-liked':''}" data-like="${athlete.name}">${liked.includes(athlete.name)?'★ Dans ma liste':'☆ Ajouter'}</button></div></article>`).join(''):'<p class="empty">Aucun sportif ne correspond à cette recherche.</p>';document.querySelectorAll('[data-like]').forEach(button=>button.addEventListener('click',()=>{const name=button.dataset.like;const index=liked.indexOf(name);if(index<0){liked.push(name);button.classList.add('is-liked');button.textContent='★ Dans ma liste'}else{liked.splice(index,1);button.classList.remove('is-liked');button.textContent='☆ Ajouter'}localStorage.setItem('sportbox-athletes',JSON.stringify(liked))}))}
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(item=>item.setAttribute('aria-pressed','false'));button.setAttribute('aria-pressed','true');active=button.dataset.filter;render()}));search.addEventListener('input',render);render();
